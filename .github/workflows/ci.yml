name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Self-hosted (docker-labeled): private repository, hosted runners bill per minute.
    runs-on: [self-hosted, docker]

    strategy:
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # After checkout: self-hosted workspaces persist between runs, so a
      # pre-checkout run would silently verify a stale tree.
      - name: Contract drift check
        run: ./scripts/check-contract-drift.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack smoke test
        run: node scripts/pack-smoke.mjs
