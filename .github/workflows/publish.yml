name: Publish to npm

on:
  push:
    tags:
      - "v*"

# Trusted publishing (OIDC): npm verifies the release came from this
# repository and workflow, so there is no NPM_TOKEN secret to rotate.
# The published tarball carries a provenance attestation.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Public repository: hosted runners are free, self-hosted no longer needed.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
