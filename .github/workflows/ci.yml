name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Self-hosted: private repository, hosted runners bill per minute.
    runs-on: self-hosted

    strategy:
      matrix:
        node: ['20', '22']

    steps:
      - name: Contract drift check
        run: ./scripts/check-contract-drift.sh

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack smoke test
        run: node scripts/pack-smoke.mjs
